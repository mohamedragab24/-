name: Deploy Firebase Functions

# تشغيل يدوي: GitHub -> Actions -> "Deploy Firebase Functions" -> Run workflow
# (ملاحظة: الدوال الآن تعمل على Vercel عبر /api/fn، وهذا الـ workflow اختياري ويحتاج خطة Blaze)
on:
  workflow_dispatch:

env:
  FIREBASE_PROJECT: studio-7708799057-99672

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check service account secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is missing. Add it in GitHub -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install firebase-tools and function dependencies
        run: |
          npm install -g firebase-tools
          cd functions && npm install --omit=dev

      # 1) الدوال الأساسية (لا تحتاج أسرار R2): الشراء، المحفظة، المجموعات، الأدمن، الإشعارات...
      #    لو فشلت هذه الخطوة يفشل الـ workflow بوضوح.
      - name: Deploy core functions (no secrets needed)
        run: |
          firebase deploy --project "$FIREBASE_PROJECT" --force --non-interactive --only \
          functions:purchaseCourse,functions:adminAdjustWallet,functions:onPaymentCompleted,\
          functions:createGroup,functions:sendGroupInvite,functions:respondGroupInvite,functions:removeGroupMember,\
          functions:registerGroupContent,functions:createGroupQuiz,functions:submitGroupQuiz,\
          functions:startGroupSession,functions:endGroupSession,functions:attachGroupRecording,\
          functions:getGroupMeetingToken,functions:payGroupBills,functions:ensurePublicId,\
          functions:assignPublicIdOnSignup,functions:backfillPublicIds,\
          functions:groupUsageSnapshot,functions:groupWeeklyBilling,functions:groupBalanceWarnings,\
          functions:onUserProfileUpdated,functions:reviewCourse,functions:grantAdmin,functions:setUserBan,\
          functions:scheduleNotification,functions:onIstifhamScheduled,functions:dispatchScheduledNotifications,\
          functions:expireUserBans,functions:getJaasMeetingToken,functions:jaasRecordingWebhook,\
          functions:logAnalyticsEvent,functions:logUserActivity,functions:sendNotificationCampaign,\
          functions:ensureReferralCode

      # 2) إعداد أسرار R2 إن أضفتها في GitHub Secrets
      - name: Set R2 secrets (optional)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=0
          for n in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            v="${!n}"
            if [ -n "$v" ]; then
              printf %s "$v" | firebase functions:secrets:set "$n" --data-file - --project "$FIREBASE_PROJECT" --force --non-interactive
            else
              echo "::warning::skip $n (not provided in GitHub Secrets)"
              missing=1
            fi
          done
          echo "R2_MISSING=$missing" >> "$GITHUB_ENV"

      # 3) دوال R2 (الفيديوهات والرفع): تُنشر فقط لو الأسرار الأربعة موجودة
      - name: Deploy R2 functions
        if: env.R2_MISSING == '0'
        run: |
          firebase deploy --project "$FIREBASE_PROJECT" --force --non-interactive --only \
          functions:getSignedVideoUrl,functions:createR2UploadUrl,functions:getR2MediaUrl,\
          functions:checkCourseAccess,functions:getMyPurchasedCourseIds,functions:syncCourseManifest,\
          functions:syncPurchaseEntitlement,functions:syncPurchaseIndex,functions:backfillCourseManifests,\
          functions:deleteGroup,functions:deleteGroupContent,functions:getGroupMediaUrl,\
          functions:createGroupUploadUrl,functions:groupFreezeAndPurge

      - name: R2 reminder
        if: env.R2_MISSING == '1'
        run: echo "::warning::دوال الفيديو/الرفع لم تُنشر لأن أسرار R2 ناقصة. أضفها في GitHub Secrets ثم أعد التشغيل."
